[workspace]
members = [
    "crates/nexql-mcp",
    "crates/nexql-proto",
    "crates/nexql-tools",
    "crates/nexql-index",
    "crates/nexql-conn",
    "crates/nexql-policy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NexQL-OSS/mcp"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

nexql-conn = { path = "crates/nexql-conn" }
nexql-index = { path = "crates/nexql-index" }
nexql-policy = { path = "crates/nexql-policy" }
nexql-proto = { path = "crates/nexql-proto" }
nexql-tools = { path = "crates/nexql-tools" }
