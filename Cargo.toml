[workspace]
members = [
    "crates/nexql-mcp",
    "crates/nexql-proto",
    "crates/nexql-tools",
    "crates/nexql-index",
    "crates/nexql-conn",
    "crates/nexql-policy",
]
default-members = [
    "crates/nexql-mcp",
    "crates/nexql-proto",
    "crates/nexql-tools",
    "crates/nexql-index",
    "crates/nexql-conn",
    "crates/nexql-policy",
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/NexQL-OSS/mcp"
homepage = "https://github.com/NexQL-OSS/mcp"
readme = "README.md"
keywords = ["postgres", "mcp", "sql", "llm", "database"]
categories = ["database", "command-line-utilities"]
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "process", "fs", "time", "io-util", "io-std", "sync", "net", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
chrono = { version = "0.4", features = ["clock"] }
uuid = "1"
rust_decimal = { version = "1", default-features = false, features = ["db-tokio-postgres"] }
deadpool-postgres = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8"
pg_query = "6.1"
url = "2"
base64 = "0.22"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
tower = "0.5"
ratatui = "0.30"
crossterm = "0.29"
similar = "3"
fs2 = "0.4"
keyring = "3"

# `version` is required for `cargo publish` (path-only deps are rejected on crates.io).
# Keep these in sync with [workspace.package] version above on every release bump.
nexql-conn = { path = "crates/nexql-conn", version = "0.2.4" }
nexql-index = { path = "crates/nexql-index", version = "0.2.4" }
nexql-policy = { path = "crates/nexql-policy", version = "0.2.4" }
nexql-proto = { path = "crates/nexql-proto", version = "0.2.4" }
nexql-tools = { path = "crates/nexql-tools", version = "0.2.4" }
