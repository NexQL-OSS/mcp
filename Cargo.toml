[workspace]
members = [
    "crates/nexql-mcp",
    "crates/nexql-proto",
    "crates/nexql-tools",
    "crates/nexql-index",
    "crates/nexql-conn",
    "crates/nexql-policy",
    "crates/nexql-spike",
]
# Spike is throwaway (Phase 0); keep it out of default `cargo build` / CI product builds.
default-members = [
    "crates/nexql-mcp",
    "crates/nexql-proto",
    "crates/nexql-tools",
    "crates/nexql-index",
    "crates/nexql-conn",
    "crates/nexql-policy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NexQL-OSS/mcp"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "process", "fs", "time", "io-util", "io-std", "sync"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8"
pg_query = "6.1"
url = "2"

nexql-conn = { path = "crates/nexql-conn" }
nexql-index = { path = "crates/nexql-index" }
nexql-policy = { path = "crates/nexql-policy" }
nexql-proto = { path = "crates/nexql-proto" }
nexql-tools = { path = "crates/nexql-tools" }
