# cargo-dist workspace config (https://axodotdev.github.io/cargo-dist/)
#
# Bootstrap:
#   cargo install cargo-dist
#   dist init --yes   # regenerates .github/workflows/release.yml from this file
#
# Release: push a semver tag (v0.1.0). CI builds archives for [dist].targets.
#
# Musl: not enabled yet — pg_query needs clang/C toolchain. Linux GNU
# targets are built on Ubuntu 22.04 (glibc 2.35) for broad distro coverage.

[workspace]
members = ["cargo:."]

[dist]
# Pin when running `dist init`; bump after successful releases.
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Build only the CLI binary crate (workspace leaves stay unpublished).
precise-builds = true
create-release = true

# clang for pg_query on Linux runners:
github-build-setup = "build-setup.yml"
