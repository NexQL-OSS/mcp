# See https://embarkstudios.github.io/cargo-deny/

[graph]
# Phase 0 throwaway spike has publish = false; keep it out of the product deny gate.
exclude-unpublished = true

[advisories]
version = 2
ignore = [
    # Unmaintained-only advisories (no known vulnerability). Revisit each release.
    # number_prefix <- indicatif <- hf-hub <- nexql-index (optional `embeddings` feature only).
    "RUSTSEC-2025-0119",
    # paste (proc-macro) <- gemm <- candle-core <- nexql-index (optional `embeddings` feature only).
    "RUSTSEC-2024-0436",
    # rkyv 0.7.x lockfile-only via rust_decimal optional dep; not enabled (see .cargo/audit.toml).
    "RUSTSEC-2026-0235",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots ships the Mozilla CA bundle as data under CDLA-Permissive-2.0.
    # Permissive, no copyleft on our code; reaches us via hf-hub -> ureq (embeddings feature).
    "CDLA-Permissive-2.0",
]
# Our own crates are GPL-3.0-only (see workspace Cargo.toml). GPL stays OUT of
# `allow` above on purpose: a copyleft *dependency* must never slip in silently.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "nexql-mcp" },
    { allow = ["GPL-3.0-only"], crate = "nexql-proto" },
    { allow = ["GPL-3.0-only"], crate = "nexql-tools" },
    { allow = ["GPL-3.0-only"], crate = "nexql-index" },
    { allow = ["GPL-3.0-only"], crate = "nexql-conn" },
    { allow = ["GPL-3.0-only"], crate = "nexql-policy" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
