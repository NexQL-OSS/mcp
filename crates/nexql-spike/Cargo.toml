[package]
name = "nexql-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Phase 0 throwaway spike: tokio-postgres + candle MiniLM"
publish = false

[[bin]]
name = "nexql-spike"
path = "src/main.rs"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "io-util"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"
