[package]
name = "nexql-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Standalone Postgres MCP server — CLI, subcommands, wiring"

[package.metadata.dist]
# Also shipped as prebuilt binaries via cargo-dist / GitHub Releases + npm.
dist = true

[features]
default = []
embeddings = ["nexql-index/embeddings"]

[dependencies]
async-trait = "0.1"
clap = { workspace = true }
crossterm = { workspace = true }
nexql-conn = { workspace = true }
nexql-index = { workspace = true }
nexql-policy = { workspace = true }
nexql-proto = { workspace = true }
nexql-tools = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nexql-mcp"
path = "src/main.rs"
