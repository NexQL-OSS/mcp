[package]
name = "nexql-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standalone Postgres MCP server — CLI, subcommands, wiring"
publish = false

[features]
default = []
embeddings = ["nexql-index/embeddings"]

[dependencies]
async-trait = "0.1"
clap = { workspace = true }
nexql-conn = { workspace = true }
nexql-index = { workspace = true }
nexql-policy = { workspace = true }
nexql-proto = { workspace = true }
nexql-tools = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "nexql-mcp"
path = "src/main.rs"
