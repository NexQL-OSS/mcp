name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify-release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bump-version.sh --check "$TAG_VERSION"

  build:
    needs: verify
    name: build-${{ matrix.vendor }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container != '' && matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux binaries against glibc 2.35 (Ubuntu 22.04) so prebuilts
          # run on Debian 12 / Ubuntu 22.04 / RHEL 9 — not only 24.04+ hosts.
          - vendor: linux-x64
            runner: ubuntu-22.04
            container: ""
            triple: x86_64-unknown-linux-gnu
            bin: nexql-mcp
            npm_pkg: mcp-linux-x64
          - vendor: linux-arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:22.04
            triple: aarch64-unknown-linux-gnu
            bin: nexql-mcp
            npm_pkg: mcp-linux-arm64
          - vendor: darwin-x64
            runner: macos-14
            container: ""
            triple: x86_64-apple-darwin
            bin: nexql-mcp
            npm_pkg: mcp-darwin-x64
          - vendor: darwin-arm64
            runner: macos-latest
            container: ""
            triple: aarch64-apple-darwin
            bin: nexql-mcp
            npm_pkg: mcp-darwin-arm64
          - vendor: win32-x64
            runner: windows-latest
            container: ""
            triple: x86_64-pc-windows-msvc
            bin: nexql-mcp.exe
            npm_pkg: mcp-win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install clang (Linux pg_query bindgen)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang libclang-dev binutils
          else
            apt-get update
            apt-get install -y clang libclang-dev binutils
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (--locked)
        run: cargo build --release --locked -p nexql-mcp --target ${{ matrix.triple }}

      - name: Verify Linux glibc portability
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify-glibc.sh
          ./scripts/verify-glibc.sh "target/${{ matrix.triple }}/release/${{ matrix.bin }}"

      - name: Package dist + vendor archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TRIPLE="${{ matrix.triple }}"
          VENDOR="${{ matrix.vendor }}"
          BIN="${{ matrix.bin }}"
          SRC="target/${TRIPLE}/release/${BIN}"
          test -f "$SRC"

          STAGE="nexql-mcp-${TAG}-${TRIPLE}"
          mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/"
          cp README.md LICENSE* NOTICE "$STAGE/" 2>/dev/null || cp README.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

          mkdir -p "dist/vendor/${VENDOR}"
          cp "$SRC" "dist/vendor/${VENDOR}/${BIN}"
          tar -czf "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz" -C "dist/vendor" "${VENDOR}"
          sha256sum "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz" > "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz" > "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz.sha256"

      - name: Stage npm platform package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/package-npm-platform.sh
          ./scripts/package-npm-platform.sh \
            "${{ matrix.vendor }}" \
            "target/${{ matrix.triple }}/release/${{ matrix.bin }}"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.vendor }}
          path: |
            nexql-mcp-*-${{ matrix.triple }}.tar.gz*
            nexql-mcp-*-vendor-${{ matrix.vendor }}.tar.gz*

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm_pkg }}
          path: npm/packages/${{ matrix.npm_pkg }}

  # Packaged centrally on ubuntu-latest (rather than per-matrix-leg) so the
  # win32-x64 build runner never needs `zip` on PATH.
  package-mcpb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Package MCPB bundles
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/package-mcpb.sh
          mkdir -p dist-mcpb
          for archive in dist-artifacts/nexql-mcp-*-vendor-*.tar.gz; do
            vendor_and_ext="${archive#*-vendor-}"
            vendor="${vendor_and_ext%.tar.gz}"
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            bin_path="$(find "$extract_dir/$vendor" -maxdepth 1 -type f)"
            ./scripts/package-mcpb.sh "$vendor" "$bin_path" dist-mcpb
            rm -rf "$extract_dir"
          done

      - name: Upload MCPB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mcpb
          path: dist-mcpb/**

  # Renders Formula/nexql-mcp.rb as a release asset for a homebrew-tap maintainer
  # to copy in — this repo has no push access to a separate tap repo, so it
  # cannot publish `brew install` support end-to-end on its own.
  render-homebrew-formula:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Render formula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/render-homebrew-formula.sh
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-brew
          ./scripts/render-homebrew-formula.sh "$VERSION" dist-artifacts "dist-brew/nexql-mcp.rb"

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-brew
          path: dist-brew/**

  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang (pg_query bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cargo cyclonedx --format json --describe binaries --quiet
          mkdir -p dist-sbom
          cp crates/nexql-mcp/nexql-mcp_bin.cdx.json "dist-sbom/nexql-mcp-${TAG}-sbom.cdx.json"
          cd dist-sbom
          sha256sum "nexql-mcp-${TAG}-sbom.cdx.json" > "nexql-mcp-${TAG}-sbom.cdx.json.sha256"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sbom
          path: dist-sbom/**

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nexql-oss/mcp:${{ github.ref_name }}
            ghcr.io/nexql-oss/mcp:latest

  publish-cargo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang (pg_query bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          crates=(nexql-policy nexql-proto nexql-conn nexql-index nexql-tools nexql-mcp)
          for crate in "${crates[@]}"; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A "nexql-mcp-release-ci (github.com/NexQL-OSS/mcp)" "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$status" = "200" ]; then
              echo "skip: ${crate} ${version} already published"
              continue
            fi
            cargo publish -p "$crate" --locked
            sleep 20
          done

      # rust-cache post-step treats any `target/**/tests` dir as trybuild/macrotest
      # scratch and tries to opendir `tests/{target,trybuild}`. `cargo publish`
      # leaves `target/package/*/tests/` behind, which triggers harmless but
      # alarming ENOENT annotations on the workflow summary.
      - name: Remove cargo package staging (rust-cache cleanup workaround)
        if: always()
        run: rm -rf target/package

  publish-npm:
    needs: publish-cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-staged

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in mcp-darwin-arm64 mcp-darwin-x64 mcp-linux-arm64 mcp-linux-x64 mcp-win32-x64; do
            cp -a "npm-staged/npm-${pkg}/." "npm/packages/${pkg}/"
            chmod +x npm/packages/${pkg}/bin/* 2>/dev/null || true
            (cd "npm/packages/${pkg}" && npm publish --access public --provenance)
          done
          (cd npm && npm publish --access public --provenance)

  release:
    needs: [publish-npm, package-mcpb, sbom, render-homebrew-formula]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          cd dist-artifacts
          cat *.sha256 > SHA256SUMS

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
