name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.vendor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: linux-x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            bin: nexql-mcp
            npm_pkg: mcp-linux-x64
          - vendor: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            bin: nexql-mcp
            npm_pkg: mcp-linux-arm64
          - vendor: darwin-x64
            # macos-13 (Intel) runners were stuck in `queued` for 1h+ / hung
            # 7h11m in an earlier release run — GH's Intel pool is starved.
            # Cross-compile x86_64-apple-darwin from an Apple Silicon runner
            # instead (Xcode's SDK on macos-14 ships both arches; `triple`
            # below is passed explicitly to rustup/cargo, so the host arch
            # doesn't need to match the target).
            runner: macos-14
            triple: x86_64-apple-darwin
            bin: nexql-mcp
            npm_pkg: mcp-darwin-x64
          - vendor: darwin-arm64
            runner: macos-latest
            triple: aarch64-apple-darwin
            bin: nexql-mcp
            npm_pkg: mcp-darwin-arm64
          - vendor: win32-x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            bin: nexql-mcp.exe
            npm_pkg: mcp-win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install clang (Linux pg_query bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p nexql-mcp --target ${{ matrix.triple }}

      - name: Package dist + vendor archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TRIPLE="${{ matrix.triple }}"
          VENDOR="${{ matrix.vendor }}"
          BIN="${{ matrix.bin }}"
          SRC="target/${TRIPLE}/release/${BIN}"
          test -f "$SRC"

          STAGE="nexql-mcp-${TAG}-${TRIPLE}"
          mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/"
          cp README.md LICENSE* "$STAGE/" 2>/dev/null || cp README.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"

          mkdir -p "dist/vendor/${VENDOR}"
          cp "$SRC" "dist/vendor/${VENDOR}/${BIN}"
          tar -czf "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz" -C "dist/vendor" "${VENDOR}"

      - name: Stage npm platform package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/package-npm-platform.sh
          ./scripts/package-npm-platform.sh \
            "${{ matrix.vendor }}" \
            "target/${{ matrix.triple }}/release/${{ matrix.bin }}"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.vendor }}
          path: |
            nexql-mcp-*-${{ matrix.triple }}.tar.gz
            nexql-mcp-*-vendor-${{ matrix.vendor }}.tar.gz

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm_pkg }}
          path: npm/packages/${{ matrix.npm_pkg }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-staged

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in mcp-darwin-arm64 mcp-darwin-x64 mcp-linux-arm64 mcp-linux-x64 mcp-win32-x64; do
            cp -a "npm-staged/npm-${pkg}/." "npm/packages/${pkg}/"
            (cd "npm/packages/${pkg}" && npm publish --access public)
          done
          (cd npm && npm publish --access public)

  publish-cargo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang (pg_query bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # policy/proto/conn have no internal deps; index needs conn;
          # tools needs conn+index+policy; mcp (bin) needs all of them.
          # crates.io index propagation lags a publish by a few seconds,
          # so pause between each so the next crate's path-dep resolves.
          crates=(nexql-policy nexql-proto nexql-conn nexql-index nexql-tools nexql-mcp)
          for crate in "${crates[@]}"; do
            cargo publish -p "$crate" --locked
            sleep 20
          done
