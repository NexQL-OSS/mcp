name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify-release-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches manifest versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bump-version.sh --check "$TAG_VERSION"

  build:
    needs: verify
    name: build-${{ matrix.vendor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: linux-x64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            bin: nexql-mcp
            npm_pkg: mcp-linux-x64
          - vendor: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            bin: nexql-mcp
            npm_pkg: mcp-linux-arm64
          - vendor: darwin-x64
            runner: macos-14
            triple: x86_64-apple-darwin
            bin: nexql-mcp
            npm_pkg: mcp-darwin-x64
          - vendor: darwin-arm64
            runner: macos-latest
            triple: aarch64-apple-darwin
            bin: nexql-mcp
            npm_pkg: mcp-darwin-arm64
          - vendor: win32-x64
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            bin: nexql-mcp.exe
            npm_pkg: mcp-win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install clang (Linux pg_query bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (--locked)
        run: cargo build --release --locked -p nexql-mcp --target ${{ matrix.triple }}

      - name: Package dist + vendor archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TRIPLE="${{ matrix.triple }}"
          VENDOR="${{ matrix.vendor }}"
          BIN="${{ matrix.bin }}"
          SRC="target/${TRIPLE}/release/${BIN}"
          test -f "$SRC"

          STAGE="nexql-mcp-${TAG}-${TRIPLE}"
          mkdir -p "$STAGE"
          cp "$SRC" "$STAGE/"
          cp README.md LICENSE* NOTICE "$STAGE/" 2>/dev/null || cp README.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

          mkdir -p "dist/vendor/${VENDOR}"
          cp "$SRC" "dist/vendor/${VENDOR}/${BIN}"
          tar -czf "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz" -C "dist/vendor" "${VENDOR}"
          sha256sum "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz" > "nexql-mcp-${TAG}-vendor-${VENDOR}.tar.gz.sha256"

      - name: Stage npm platform package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/package-npm-platform.sh
          ./scripts/package-npm-platform.sh \
            "${{ matrix.vendor }}" \
            "target/${{ matrix.triple }}/release/${{ matrix.bin }}"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.vendor }}
          path: |
            nexql-mcp-*-${{ matrix.triple }}.tar.gz*
            nexql-mcp-*-vendor-${{ matrix.vendor }}.tar.gz*

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm_pkg }}
          path: npm/packages/${{ matrix.npm_pkg }}

  publish-cargo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang (pg_query bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          crates=(nexql-policy nexql-proto nexql-conn nexql-index nexql-tools nexql-mcp)
          for crate in "${crates[@]}"; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A "nexql-mcp-release-ci (github.com/NexQL-OSS/mcp)" "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$status" = "200" ]; then
              echo "skip: ${crate} ${version} already published"
              continue
            fi
            cargo publish -p "$crate" --locked
            sleep 20
          done

  publish-npm:
    needs: publish-cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-staged

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in mcp-darwin-arm64 mcp-darwin-x64 mcp-linux-arm64 mcp-linux-x64 mcp-win32-x64; do
            cp -a "npm-staged/npm-${pkg}/." "npm/packages/${pkg}/"
            chmod +x npm/packages/${pkg}/bin/* 2>/dev/null || true
            (cd "npm/packages/${pkg}" && npm publish --access public --provenance)
          done
          (cd npm && npm publish --access public --provenance)

  release:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          cd dist-artifacts
          cat *.sha256 > SHA256SUMS

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
