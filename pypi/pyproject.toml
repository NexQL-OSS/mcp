# PyPI / uv tool install packaging (maturin binary wheels).
# Built per-platform in release CI — see docs/publish-pypi-uv.md.
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "nexql-mcp"
version = "0.2.1"
description = "Standalone Postgres MCP server — schema-aware, read-only by default"
readme = "../README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.8"
keywords = ["mcp", "postgres", "database", "sql"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Database",
]
[project.urls]
Homepage = "https://github.com/NexQL-OSS/mcp"
Repository = "https://github.com/NexQL-OSS/mcp"
Documentation = "https://github.com/NexQL-OSS/mcp/blob/main/docs/clients/README.md"

[tool.maturin]
bindings = "bin"
manifest-path = "../crates/nexql-mcp/Cargo.toml"
module-name = "nexql_mcp"
python-source = "python"
strip = true
